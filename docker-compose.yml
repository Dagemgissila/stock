version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    networks:
      - stocknet

  db:
    image: mysql:8.0
    container_name: stock_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stockdb
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: stockuser
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - stocknet

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    restart: unless-stopped
    networks:
      - stocknet

  nginx:
    image: nginx:1.25-alpine
    container_name: stock_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - stocknet

volumes:
  dbdata:

networks:
  stocknet:
    driver: bridge
